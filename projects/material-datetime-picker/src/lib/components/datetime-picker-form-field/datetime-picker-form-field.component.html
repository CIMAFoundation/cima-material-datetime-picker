<mat-form-field class="datetime-picker-form-field">
  <mat-label>Date Time Picker</mat-label>
  <input matInput type="text" [(ngModel)]="dateTime">
  <button matSuffix mat-icon-button aria-label="Time" [matMenuTriggerFor]="dateTimePickerMenu">
    <mat-icon>calendar_month</mat-icon>
  </button>
  <mat-menu #dateTimePickerMenu="matMenu">
    <div class="date-picker-wrapper" (click)="$event.stopPropagation();">
      <cima-date-picker (date)="getDate($event)"></cima-date-picker>
    </div>

    <div class="time-picker-wrapper">
      <cima-time-picker (time)="getTime($event)"></cima-time-picker>
      <div class="button-wrapper">
        <button mat-button>{{cancelLabel}}</button>
        <button mat-button (click)="setDateTime()">{{confirmLabel}}</button>
      </div>
    </div>
  </mat-menu>
</mat-form-field>
