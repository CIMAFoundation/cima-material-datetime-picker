
      <label>Select Time</label>
      <div class="input-fields-wrapper" (click)="$event.stopPropagation();">
        <!--hour-->
        <input type="number" min="0" max="12" class="input-field" [(ngModel)]="hour" (ngModelChange)="setTime()">
        <!--separator-->
        <div class="separator">
          <span>{{separator}}</span>
        </div>
        <!--minutes-->
        <input type="number" min="0" max="59" class="input-field" [(ngModel)]="minute" (ngModelChange)="setTime()">
      </div>

      <!--meridian selector-->
      @if(format === '12') {
        <div class="meridian-wrapper" (click)="$event.stopPropagation();">
          <mat-button-toggle-group name="meridianToggle" aria-label="Meridian Toggle" [(ngModel)]="meridianTime">
            <mat-button-toggle value="{{amLabel}}" (click)="setMeridianTime(amLabel)">{{amLabel}}</mat-button-toggle>
            <mat-button-toggle value="{{pmLabel}}" (click)="setMeridianTime(pmLabel)">{{pmLabel}}</mat-button-toggle>
          </mat-button-toggle-group>
        </div>
      }
