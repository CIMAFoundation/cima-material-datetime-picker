<mat-datepicker #calendar [disabled]="disabled || inputDisabled" [startAt]="startAt" [startView]="startView"
  [touchUi]="touchUi" [xPosition]="xPosition" [yPosition]="yPosition" [restoreFocus]="restoreFocus"
  [panelClass]="panelClass" [color]="color" [dateClass]="dateClass" [calendarHeaderComponent]="headerBridge"
  (opened)="onOpened()" (closed)="onClosed()" (yearSelected)="yearSelected.emit($event)"
  (monthSelected)="monthSelected.emit($event)" (viewChanged)="viewChanged.emit($event)">
  <mat-datepicker-actions>
    <div class="content" [class]="panelClass">
      <mat-divider />
      <cima-time-picker [(value)]="draftTime" [hourCycle]="hourCycle" [hourDial]="hourDial"
        [minTime]="timeConstraints.minTime" [maxTime]="timeConstraints.maxTime" [timeFilter]="timeConstraints.timeFilter"
        [hourStep]="hourStep" [minuteStep]="minuteStep" [secondStep]="secondStep" [labels]="labels"
        [timeView]="timeView" [allowViewSwitch]="allowViewSwitch" [showSeconds]="showSeconds" />
      @if (showDraftError) {
        <p class="error" role="alert">{{ intl.unavailableTime }}</p>
      }
      <div class="actions">
        <mat-divider />
        <button type="button" matButton matDatepickerCancel>{{ intl.cancel }}</button>
        <button type="button" matButton matDatepickerApply [disabled]="!canConfirm">{{ intl.confirm }}</button>
      </div>
    </div>
  </mat-datepicker-actions>
</mat-datepicker>
